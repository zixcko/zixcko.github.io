<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ikigai — Ringkasan Buku</title>
<meta name="description" content="Ringkasan interaktif buku Ikigai karya Héctor García dan Francesc Miralles dalam 10 slide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF8;
    --surface: #FFFFFF;
    --ink: #2B2A28;
    --muted: #6B6860;
    --line: #E6E2D9;
    --accent: #0061FE;
    --accent-ink: #FFFFFF;
    --accent-soft: #EAF2FF;
    --accent-line: #C9DDFF;
    --hl: #FFE58F;
    --hly: #FFE58F;
    --pale: rgba(0, 97, 254, 0.07);
    --shadow: 0 1px 2px rgba(43, 42, 40, 0.06), 0 10px 28px rgba(43, 42, 40, 0.07);
    --serif: "Fraunces", "Lora", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --surface: #201F1C;
      --ink: #F2EFE8;
      --muted: #A8A399;
      --line: #35332E;
      --accent: #6AA6FF;
      --accent-ink: #0B1B33;
      --accent-soft: rgba(106, 166, 255, 0.12);
      --accent-line: rgba(106, 166, 255, 0.35);
      --hl: rgba(255, 229, 143, 0.30);
      --pale: rgba(106, 166, 255, 0.09);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1, h2, p, figure, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Bilah atas ---------- */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--line); z-index: 30; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
  .top {
    position: fixed; top: 3px; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; font-size: .82rem; color: var(--muted); pointer-events: none;
  }
  .top .brand { font-family: var(--serif); font-weight: 600; letter-spacing: .01em; }
  .top .mark { font-variant-numeric: tabular-nums; letter-spacing: .08em; font-weight: 600; color: var(--ink); }

  /* ---------- Panggung & slide ---------- */
  #stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto;
    padding: 72px 20px 112px;
    opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility 0s linear .45s;
    -webkit-overflow-scrolling: touch;
  }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .45s ease, visibility 0s; }

  .inner {
    position: relative; max-width: 640px; margin: 0 auto; min-height: 100%;
    display: grid; align-content: center; gap: 28px;
  }
  .col { position: relative; z-index: 1; display: grid; gap: 20px; align-content: center; min-width: 0; }
  @media (min-width: 900px) {
    .slide { padding: 84px 48px 116px; }
    .inner { max-width: 1080px; grid-template-columns: 1.02fr 1fr; gap: 64px; align-items: center; }
  }

  .bgnum {
    position: absolute; right: -4px; top: 0; z-index: 0; pointer-events: none; user-select: none;
    font-family: var(--serif); font-weight: 700; line-height: 1;
    font-size: clamp(8rem, 24vw, 16rem); color: var(--pale);
  }

  /* ---------- Tipografi ---------- */
  h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(3.4rem, 11vw, 6.4rem); line-height: 1; letter-spacing: -.02em; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.95rem, 4.8vw, 3rem); line-height: 1.12; letter-spacing: -.01em; }
  .kick { font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .sub { font-family: var(--serif); font-weight: 500; font-size: clamp(1.1rem, 2.4vw, 1.4rem); line-height: 1.35; color: var(--muted); }
  .by { font-size: .95rem; color: var(--muted); }
  .core { font-size: clamp(1.15rem, 2.2vw, 1.4rem); line-height: 1.55; }

  /* Stabilo */
  .hl {
    background-image: linear-gradient(var(--hl), var(--hl));
    background-repeat: no-repeat; background-position: 0 90%; background-size: 0 .55em;
    padding: 0 .12em; margin: 0 -.12em; border-radius: 3px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .slide.on .hl { background-size: 100% .55em; transition: background-size .9s cubic-bezier(.3, .7, .2, 1) .7s; }
  .slide:not(.on) .hl { transition: background-size 0s linear .45s; }

  /* Muncul bergantian */
  .rv { opacity: 0; transform: translateY(16px); }
  .slide.on .rv {
    opacity: 1; transform: none;
    transition: opacity .6s ease calc(var(--i, 0) * 90ms + 120ms), transform .6s cubic-bezier(.2, .7, .2, 1) calc(var(--i, 0) * 90ms + 120ms);
  }
  .slide:not(.on) .rv { transition: opacity 0s linear .45s, transform 0s linear .45s; }

  /* ---------- Poin & Terapkan ---------- */
  .pts { display: grid; }
  .pt { padding: 18px 0; border-top: 1px solid var(--line); font-size: clamp(1.02rem, 1.7vw, 1.15rem); line-height: 1.6; }
  .pt:last-child { border-bottom: 1px solid var(--line); }
  .pt > span { display: block; transition: transform .25s ease; }
  .pt:hover > span { transform: translateX(5px); }

  .apply {
    padding: 20px 22px; border-radius: 16px; background: var(--accent-soft);
    border: 1px solid var(--accent-line); box-shadow: var(--shadow);
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .apply:hover { border-color: var(--accent); box-shadow: 0 2px 4px rgba(0, 0, 0, .06), 0 14px 32px rgba(0, 97, 254, .14); }
  .lab { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .lab svg { width: 18px; height: 18px; }
  .apply p:last-child { font-size: 1.02rem; line-height: 1.6; }

  /* ---------- Hero ---------- */
  .hero-col { gap: 16px; }
  .stat { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; padding: 6px 0 2px; }
  .stat .big { font-family: var(--serif); font-weight: 700; font-size: clamp(2.8rem, 7vw, 4rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat .cap { font-size: .95rem; color: var(--muted); max-width: 22ch; line-height: 1.4; }
  .btn {
    justify-self: start; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
    min-height: 48px; padding: 12px 26px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1rem;
    box-shadow: 0 6px 18px rgba(0, 97, 254, .25);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 97, 254, .32); }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 18px; height: 18px; transition: transform .2s ease; }
  .btn:hover svg { transform: translateX(4px); }

  /* ---------- Ilustrasi ---------- */
  .ill { width: 100%; max-width: 420px; justify-self: center; }
  .ill svg { display: block; width: 100%; height: auto; max-height: min(42vh, 320px); margin: 0 auto; transition: transform .4s ease; }
  .ill:hover svg { transform: scale(1.025); }
  .ln { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .acl { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .bgf { fill: var(--bg); }
  .sf { fill: var(--surface); }
  .hf { fill: var(--hly); }
  .ac { fill: var(--accent); }
  .vn { fill: var(--accent); fill-opacity: .1; }
  .dash { stroke-dasharray: 6 7; }
  .ill text { font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--ink); }
  .ill text.mut { fill: var(--muted); font-weight: 500; }
  .ill text.dk { fill: #2B2A28; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .slide.on .draw { stroke-dashoffset: 0; transition: stroke-dashoffset 1.6s ease .5s; }
  .slide:not(.on) .draw { transition: stroke-dashoffset 0s linear .45s; }
  .stp { fill: var(--accent); fill-opacity: .14; opacity: 0; }
  .slide.on .stp { opacity: 1; transition: opacity .5s ease calc(.4s + var(--s, 0) * .22s); }
  .slide:not(.on) .stp { transition: opacity 0s linear .45s; }

  /* ---------- Slide terakhir ---------- */
  .check { margin: 0; padding: 18px 20px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
  .check legend { padding: 0 8px; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .ck { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; cursor: pointer; font-size: 1rem; line-height: 1.5; }
  .ck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; transition: background .2s ease, border-color .2s ease, transform .2s ease; }
  .box::after { content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) scale(0); transition: transform .2s ease; }
  .ck:hover .box { border-color: var(--accent); transform: scale(1.06); }
  .ck input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .ck input:checked + .box::after { transform: rotate(45deg) scale(1); }
  .ck input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ck input:checked ~ .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
  .prog { margin-top: 8px; }
  .prog-b { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .prog-f { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
  .prog-t { margin-top: 8px; font-size: .88rem; color: var(--muted); }
  .cta { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 16px; background: var(--hl); font-weight: 600; line-height: 1.45; transition: transform .2s ease; }
  .slide.on .cta.rv { transition: opacity .6s ease calc(var(--i, 0) * 90ms + 120ms), transform .6s cubic-bezier(.2, .7, .2, 1) calc(var(--i, 0) * 90ms + 120ms); }
  .cta svg { flex: none; width: 26px; height: 26px; }
  .last .col { gap: 14px; }
  .last .pt { padding: 12px 0; font-size: 1rem; }
  .last .ck { padding: 6px 0; font-size: .95rem; }
  .last .ill svg { max-height: min(28vh, 240px); }
  .disc { grid-column: 1 / -1; position: relative; z-index: 1; margin-top: 4px; padding-top: 20px; border-top: 1px solid var(--line); font-size: .82rem; line-height: 1.65; color: var(--muted); }

  /* ---------- Navigasi bawah ---------- */
  .nav {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 6px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
    max-width: calc(100vw - 16px);
  }
  @supports (background: color-mix(in srgb, red 50%, blue)) {
    .nav { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  }
  .nb {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; min-width: 44px; padding: 0 12px;
    border: 0; border-radius: 999px; background: transparent; cursor: pointer; font-size: .92rem; font-weight: 600;
    transition: background .2s ease, transform .2s ease, opacity .2s ease;
  }
  .nb:hover:not(:disabled) { background: var(--accent-soft); transform: scale(1.04); }
  .nb:disabled { opacity: .35; cursor: default; }
  .nb svg { width: 20px; height: 20px; flex: none; }
  .nb .t { display: none; }
  @media (min-width: 640px) { .nb .t { display: inline; } .nb { padding: 0 16px; } }
  .dots { display: flex; align-items: center; }
  .dot { position: relative; width: 18px; height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; transition: width .3s ease; }
  .dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 99px; transform: translate(-50%, -50%); background: var(--line); border: 1px solid var(--muted); transition: width .3s ease, background .3s ease, border-color .3s ease; }
  .dot:hover::after { background: var(--muted); }
  .dot[aria-current="true"] { width: 36px; }
  .dot[aria-current="true"]::after { width: 26px; background: var(--accent); border-color: var(--accent); }

  noscript { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 24px; text-align: center; z-index: 100; }

  /* ---------- Kurangi gerak ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rv { opacity: 1 !important; transform: none !important; }
    .hl { background-size: 100% .55em !important; }
    .draw { stroke-dashoffset: 0 !important; }
    .stp { opacity: 1 !important; }
  }
</style>
</head>
<body>

<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<div class="top">
  <span class="brand">Ikigai · Ringkasan Buku</span>
  <span class="mark" id="mark" aria-live="polite" aria-atomic="true">01 / 10</span>
</div>

<main id="stage" aria-label="Presentasi ringkasan buku Ikigai"></main>

<nav class="nav" aria-label="Navigasi slide">
  <button class="nb" id="prev" type="button" aria-label="Slide sebelumnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="t">Sebelumnya</span>
  </button>
  <div class="dots" id="dots"></div>
  <button class="nb" id="next" type="button" aria-label="Slide berikutnya">
    <span class="t">Berikutnya</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</nav>

<noscript>Aktifkan JavaScript untuk melihat presentasi ini.</noscript>

        'Tak perlu banyak teman; cukup beberapa yang [[rutin bertemu]] dan saling jujur.'
      ],
      x: 'Ajak satu atau dua teman dekat bertemu rutin, misalnya sebulan sekali, dengan satu aturan: ponsel disimpan.',
      a: 'Enam orang membentuk lingkaran mengelilingi simbol hati',
      i: '<svg viewBox="0 0 320 220" aria-hidden="true" focusable="false">' +
         '<circle class="acl dash" cx="160" cy="110" r="70"/>' +
         '<circle class="hf ln" cx="160" cy="110" r="24"/>' +
         '<path class="ac" d="M160 122c-14-9-18-18-10-24c5-4 10-1 10 4c0-5 5-8 10-4c8 6 4 15-10 24Z"/>' +

         '<g class="p"><circle class="sf ln" cx="90" cy="102" r="8"/><path class="ac ln" d="M77 124a13 13 0 0 1 26 0Z"/></g>' +

      p: [
        'Ikigai adalah [[alasan bangun pagi]], bukan gelar atau jabatan.',

      ],
      x: '',

        'Saya menjadwalkan 25 menit fokus untuk aktivitas yang saya sukai',
        'Saya mengajak satu teman dekat untuk bertemu'
      ],
      cta: 'Baca bukunya langsung untuk cerita lengkapnya.',
      a: 'Papan catatan dengan kotak centang dan matahari kecil di belakangnya',
      i: '<svg viewBox="0 0 320 220" aria-hidden="true" focusable="false">' +
         '<circle class="hf ln" cx="248" cy="62" r="24"/>' +
         '<rect class="sf ln" x="96" y="32" width="128" height="164" rx="14"/>' +
         '<rect class="ac ln" x="130" y="22" width="60" height="18" rx="6"/>' +
         '<rect class="sf ln" x="116" y="64" width="18" height="18" rx="4"/>' +
         '<rect class="sf ln" x="116" y="102" width="18" height="18" rx="4"/>' +
         '<rect class="sf ln" x="116" y="140" width="18" height="18" rx="4"/>' +
         '<path class="acl" d="M120 73l5 5l9-11M120 111l5 5l9-11" style="stroke-width:3"/>' +
         '<path class="ln" d="M146 74H200M146 112H192M146 150H204" opacity=".4"/>' +
         '<path class="acl" d="M60 120h14M67 113v14M270 150h14M277 143v14" opacity=".7"/>' +
         '</svg>'
    }
  ];

  /* =========================================================
     RENDER
     ========================================================= */
  const N = S.length;
  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');
  const markEl = document.getElementById('mark');
  const fillEl = document.getElementById('fill');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)');

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hl = (s) => esc(s).replace(/\[\[(.+?)\]\]/g, '<span class="hl">$1</span>');
  const pad = (n) => String(n).padStart(2, '0');

  const ICON_APPLY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
  const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7.5h8"/></svg>';

  function build(d, n) {
    const sec = document.createElement('section');
    sec.className = 'slide';
    sec.id = 'slide-' + (n + 1);
    sec.setAttribute('role', 'group');
    sec.setAttribute('aria-roledescription', 'slide');
    sec.setAttribute('aria-label', (n + 1) + ' dari ' + N);
    sec.setAttribute('aria-hidden', 'true');
    sec.inert = true;

    let r = 0;
    const R = () => 'style="--i:' + (r++) + '"';

    if (n === 0) {
      sec.innerHTML =
        '<div class="inner">' +
          '<div class="col hero-col">' +
            '<p class="kick rv" ' + R() + '>Resume buku</p>' +
            '<h1 class="rv" ' + R() + '><span class="hl">' + esc(d.t) + '</span></h1>' +
            '<p class="sub rv" ' + R() + '>' + esc(d.sub) + '</p>' +
            '<p class="by rv" ' + R() + '>Karya ' + esc(d.au) + '</p>' +
            '<p class="core rv" ' + R() + '>' + hl(d.c) + '</p>' +
            '<div class="stat rv" ' + R() + '><span class="big"><span class="num" data-to="' + d.st.n + '">0</span>' + esc(d.st.s) + '</span><span class="cap">' + esc(d.st.l) + '</span></div>' +
            '<button class="btn rv" type="button" data-next ' + R() + '>Mulai Baca ' + ICON_ARROW + '</button>' +
          '</div>' +
          '<figure class="ill rv" ' + R() + ' role="img" aria-label="' + esc(d.a) + '">' + d.i + '</figure>' +
        '</div>';
      return sec;
    }

    const left =
      '<div class="col">' +
        '<h2 class="rv" ' + R() + '>' + esc(d.t) + '</h2>' +
        '<p class="core rv" ' + R() + '>' + hl(d.c) + '</p>' +
        '<figure class="ill rv" ' + R() + ' role="img" aria-label="' + esc(d.a) + '">' + d.i + '</figure>' +
      '</div>';

    const pts = '<ul class="pts" role="list">' + d.p.map((p) => '<li class="pt rv" ' + R() + '><span>' + hl(p) + '</span></li>').join('') + '</ul>';

    let extra = '';
    if (d.x) {
      extra = '<aside class="apply rv" ' + R() + '><p class="lab">' + ICON_APPLY + 'Terapkan</p><p>' + hl(d.x) + '</p></aside>';
    }
    if (d.k) {
      extra =
        '<fieldset class="check rv" ' + R() + '><legend>Checklist aksi</legend>' +
          d.k.map((k) => '<label class="ck"><input type="checkbox"><span class="box" aria-hidden="true"></span><span class="tx">' + esc(k) + '</span></label>').join('') +
          '<div class="prog"><div class="prog-b" aria-hidden="true"><span class="prog-f"></span></div><p class="prog-t" aria-live="polite"></p></div>' +
        '</fieldset>' +
        '<div class="cta rv" ' + R() + '>' + ICON_BOOK + '<span>' + esc(d.cta) + '</span></div>';
    }

    const right = '<div class="col">' + pts + extra + '</div>';
    const disc = (n === N - 1) ? '<p class="disc rv" ' + R() + '>' + esc(DISCLAIMER) + '</p>' : '';

    sec.innerHTML =
      '<div class="inner' + (n === N - 1 ? ' last' : '') + '">' +
        '<div class="bgnum" aria-hidden="true">' + pad(n + 1) + '</div>' +
        left + right + disc +
      '</div>';

    const ck = sec.querySelector('.check');
    if (ck) {
      const boxes = Array.prototype.slice.call(ck.querySelectorAll('input'));
      const out = ck.querySelector('.prog-t');
      const bar = ck.querySelector('.prog-f');
      const upd = () => {
        const c = boxes.filter((b) => b.checked).length;
        out.textContent = c === boxes.length ? 'Semua langkah siap. Selamat memulai!' : c + ' dari ' + boxes.length + ' aksi dipilih';
        bar.style.width = (c / boxes.length * 100) + '%';
      };
      boxes.forEach((b) => b.addEventListener('change', upd));
      upd();
    }
    return sec;
  }

  const secs = S.map((d, n) => {
    const el = build(d, n);
    stage.appendChild(el);
    return el;
  });

  S.forEach((d, n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('aria-label', 'Ke slide ' + (n + 1) + ': ' + d.t);
    b.addEventListener('click', () => go(n));
    dotsEl.appendChild(b);
  });
  const dots = Array.prototype.slice.call(dotsEl.children);

  const nextInHero = secs[0].querySelector('[data-next]');
  if (nextInHero) nextInHero.addEventListener('click', () => go(1));

  /* =========================================================
     NAVIGASI
     ========================================================= */
  let cur = -1;

  function countUp(el) {
    const to = +el.dataset.to;
    if (el._raf) cancelAnimationFrame(el._raf);
    if (RM.matches) { el.textContent = to; return; }
    el.textContent = '0';
    const t0 = performance.now() + 500, dur = 1400;
    const step = (t) => {
      const p = Math.max(0, Math.min(1, (t - t0) / dur));
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

  function setHash(n) {
    try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) { /* diabaikan di lingkungan yang membatasi history */ }
  }

  function go(n, silent) {
    n = Math.max(0, Math.min(N - 1, n));
    if (n === cur) return;
    if (cur >= 0) {
      const old = secs[cur];
      old.classList.remove('on');
      old.inert = true;
      old.setAttribute('aria-hidden', 'true');
    }
    const s = secs[n];
    s.scrollTop = 0;
    s.classList.add('on');
    s.inert = false;
    s.removeAttribute('aria-hidden');
    cur = n;

    markEl.textContent = pad(n + 1) + ' / ' + pad(N);
    fillEl.style.width = ((n + 1) / N * 100) + '%';
    dots.forEach((d, i) => { if (i === n) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
    prevBtn.disabled = n === 0;
    nextBtn.disabled = n === N - 1;

    const num = s.querySelector('.num');
    if (num) countUp(num);
    if (!silent) setHash(n);
  }

  function fromHash() {
    const m = /^#(\d+)$/.exec(window.location.hash);
    return m ? Math.max(0, Math.min(N - 1, parseInt(m[1], 10) - 1)) : 0;
  }

  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));
  window.addEventListener('hashchange', () => go(fromHash(), true));

  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': e.preventDefault(); go(cur + 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(cur - 1); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End': e.preventDefault(); go(N - 1); break;
    }
  });

  let tx = 0, ty = 0;
  stage.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  go(fromHash(), true);
})();
</script>
